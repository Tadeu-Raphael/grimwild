name: Tagged Build + GitHub Release
on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  REF: "${{ inputs.release_tag || github.head_ref || github.ref_name }}"
jobs:
  build:
    uses: ./.github/workflows/shared-build.yml
    with:
      build_ref: "${{ inputs.release_tag || '' }}"

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: "${{ inputs.release_tag || github.ref }}"
          lfs: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: build

      - name: Verify release notes exist
        run: |
          if [ ! -f "release-notes/${REF}.md" ]; then
            echo "::error::Missing release-notes/${REF}.md"
            exit 1
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.21.0
        with:
          name: "${{ env.REF }}"
          bodyFile: "release-notes/${{ env.REF }}.md"
          artifacts: "system.json,grimwild.zip"
          artifactErrorsFailBuild: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: legacy
          token: ${{ secrets.GITHUB_TOKEN }}
